<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administração | Serviços Locais</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f8f3;color:#172c25;font:16px/1.5 system-ui,sans-serif}
header{background:#173d32;color:#fff;padding:16px}
nav,main{max-width:960px;margin:auto}
nav{display:flex;justify-content:space-between;gap:16px}
nav a{color:#fff}
main{padding:24px 16px 48px}
.filters{display:flex;flex-wrap:wrap;gap:14px}
article{border:1px solid #d7e2da;background:white;border-radius:14px;padding:18px;margin:12px 0}
summary{cursor:pointer;font-weight:650}
label{display:block;margin:10px 0}
input,select,textarea,button{font:inherit;border:1px solid #849c90;padding:8px;border-radius:8px}
input:not([type=checkbox]),select,textarea{width:100%;display:block}
.delete-provider{margin-left:8px}
button{background:#176342;color:white;cursor:pointer}
button.delete-provider{background:#a12626}
a{color:#176342}
</style>
<header><nav><strong>Serviços Locais</strong><a href="/">Abrir catálogo</a></nav></header>
<main>
<h1>Administrar prestadores</h1>
<details>
<summary>Alterar senha do administrador</summary>
<form id="password-form">
<label>Senha atual<input name="current" type="password" autocomplete="current-password" required></label>
<label>Nova senha<input name="password" type="password" autocomplete="new-password" minlength="15" required></label>
<label>Repita a nova senha<input name="confirmation" type="password" autocomplete="new-password" minlength="15" required></label>
<button>Alterar senha</button>
<p id="password-feedback" role="status"></p>
</form>
</details>
<div class="filters">
<label>Buscar por nome, telefone ou serviço<input id="search" type="search"></label>
<label>Situação<select id="status"><option value="">Todos</option><option value="pending">Pendentes</option><option value="active">Publicados</option><option value="hidden">Ocultos</option></select></label>
</div>
<p id="feedback" role="status">Carregando cadastros…</p>
<div id="providers"></div>
<template id="provider">
<article><details>
<summary></summary>
<p><a class="phone" target="_blank" rel="noopener noreferrer"></a></p>
<form>
<label>Situação<select name="status"><option value="pending">Pendente</option><option value="active">Publicado</option><option value="hidden">Oculto</option></select></label>
<label><input name="premium" type="checkbox"> Plano pago</label>
<div class="extras">
<label>Descrição<textarea name="description" maxlength="1000"></textarea></label>
<label>URL da foto<input name="photo" type="url" maxlength="2048" placeholder="https://"></label>
<label>Nota<select name="stars"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>
<label>Adicionar avaliação recebida de cliente<textarea name="review" maxlength="500"></textarea></label>
<p class="reviews"></p>
</div>
<button>Salvar alterações</button>
<button type="button" class="delete-provider">Excluir prestador</button>
<p class="message" role="status"></p>
</form></details></article>
</template>
</main>
<script>
const byId = id => document.getElementById(id);
const endpoint = '/api/admin';
const labels = {pending:'Pendente', active:'Publicado', hidden:'Oculto'};
let providers = [];
const normalize = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function title(profile) {
  return [profile.name, profile.category, labels[profile.status], profile.premium ? 'Pago' : 'Gratuito'].join(' · ');
}

function render() {
  const query = normalize(byId('search').value.trim());
  const status = byId('status').value;
  const matches = providers.filter(p => (!status || p.status === status)
    && normalize([p.name,p.phone,p.category].join(' ')).includes(query));
  byId('feedback').textContent = matches.length ? matches.length + ' cadastro(s)' : 'Nenhum cadastro encontrado.';
  byId('providers').replaceChildren(...matches.map(profile => {
    const view = byId('provider').content.cloneNode(true);
    const summary = view.querySelector('summary');
    summary.textContent = title(profile);
    const phone = view.querySelector('.phone');
    phone.textContent = profile.phone + ' · WhatsApp';
    phone.href = 'https://wa.me/55' + profile.phone;
    const form = view.querySelector('form');
    const fields = form.elements;
    for (const key of ['status','description','photo']) fields[key].value = profile[key];
    fields.premium.checked = Boolean(profile.premium);
    const extras = view.querySelector('.extras');
    const reviews = view.querySelector('.reviews');
    reviews.textContent = JSON.parse(profile.reviews).length + ' avaliação(ões) registrada(s)';
    function showExtras() {
      extras.hidden = !fields.premium.checked;
      for (const field of extras.querySelectorAll('input, textarea, select')) field.disabled = extras.hidden;
    }
    showExtras();
    fields.premium.addEventListener('change', showExtras);
    const message = view.querySelector('.message');
    const remove = view.querySelector('.delete-provider');
    const save = form.querySelector('button[type="submit"], button:not([type])');
    remove.addEventListener('click', async () => {
      if (!window.confirm('Excluir definitivamente o cadastro de ' + profile.name + '?')) return;
      remove.disabled = true;
      save.disabled = true;
      message.textContent = 'Excluindo…';
      try {
        const response = await fetch(endpoint + '?excluir=1', {method:'POST',
          headers:{'Content-Type':'application/json','X-Admin-Request':'1'},
          body:JSON.stringify({id:Number(profile.id)})});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Falha ao excluir.');
        providers = providers.filter(item => item.id !== profile.id);
        render();
        byId('feedback').textContent = result.message;
      } catch (error) {
        message.textContent = error.message;
      } finally {
        remove.disabled = false;
        save.disabled = false;
      }
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const button = save;
      button.disabled = true;
      remove.disabled = true;
      message.textContent = 'Salvando…';
      const {status, description, photo, review, stars, premium} = fields;
      const data = {id:Number(profile.id),status:status.value,description:description.value,
        photo:photo.value,review:premium.checked ? review.value : '',stars:Number(stars.value),premium:premium.checked};
      try {
        const response = await fetch(endpoint, {method:'POST',
          headers:{'Content-Type':'application/json','X-Admin-Request':'1'},body:JSON.stringify(data)});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Falha ao salvar.');
        Object.assign(profile, {status:data.status,premium:data.premium,description:data.description,photo:data.photo});
        const entries = JSON.parse(profile.reviews);
        if (data.review.trim()) entries.push({stars:data.stars,text:data.review.trim()});
        profile.reviews = JSON.stringify(entries);
        summary.textContent = title(profile);
        review.value = '';
        reviews.textContent = result.reviews + ' avaliação(ões) registrada(s)';
        message.textContent = result.message;
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        remove.disabled = false;
      }
    });
    return view;
  }));
}

async function load() {
  try {
    const response = await fetch(endpoint + '?dados=1', {cache:'no-store'});
    if (!response.ok) throw new Error();
    providers = (await response.json()).providers;
    byId('search').addEventListener('input', render);
    byId('status').addEventListener('change', render);
    render();
  } catch {
    byId('feedback').textContent = 'Não foi possível carregar os cadastros. Recarregue a página.';
  }
}
byId('password-form').addEventListener('submit', async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const button = form.querySelector('button');
  const feedback = byId('password-feedback');
  const {current, password, confirmation} = Object.fromEntries(new FormData(form));
  if (password !== confirmation) {
    feedback.textContent = 'As novas senhas precisam ser iguais.';
    return;
  }
  button.disabled = true;
  feedback.textContent = 'Alterando senha…';
  try {
    const response = await fetch(endpoint + '?senha=1', {method:'POST',
      headers:{'Content-Type':'application/json','X-Admin-Request':'1'},
      body:JSON.stringify({current,password})});
    const result = await response.json();
    feedback.textContent = result.message || result.error;
    if (response.ok) form.reset();
  } catch {
    feedback.textContent = 'Não foi possível alterar a senha. Verifique sua sessão e tente novamente.';
  } finally {
    button.disabled = false;
  }
});
load();
</script>
</html>
